name: windows-build

on:
  push:
    branches: [ci/windows-build]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - run: flutter config --enable-windows-desktop
      - run: flutter pub get
      - run: flutter build windows --release

      - name: Package
        shell: pwsh
        run: |
          $line = Select-String -Path pubspec.yaml -Pattern '^version:\s*(.+)$'
          $version = $line.Matches.Groups[1].Value.Split('+')[0]
          $name = "dart_control_panel-$version-windows-x64"
          $src = "build/windows/x64/runner/Release"
          New-Item -ItemType Directory -Path $name | Out-Null
          Copy-Item "$src/*" -Destination $name -Recurse -Force
          Compress-Archive -Path $name -DestinationPath "$name.zip" -Force
          $hash = (Get-FileHash "$name.zip" -Algorithm SHA256).Hash
          "$hash  $name.zip" | Out-File -Encoding ascii "$name.zip.sha256"

      - uses: actions/upload-artifact@v4
        with:
          name: dart_control_panel-windows-x64
          path: |
            dart_control_panel-*-windows-x64.zip
            dart_control_panel-*-windows-x64.zip.sha256
          retention-days: 30
