name: build-and-release

on:
  push:
    tags: ['v*']
    branches: [ci/windows-build]
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag (empty = v<version>-build<run_number>)
        required: false
        type: string

permissions:
  contents: write

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.meta.outputs.version }}
      tag: ${{ steps.meta.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
      - id: meta
        shell: bash
        run: |
          version="$(grep -m1 '^version:' pubspec.yaml | awk '{print $2}' | cut -d+ -f1)"
          if [ "${{ github.ref_type }}" = "tag" ]; then
            tag="${GITHUB_REF_NAME}"
          elif [ -n "${{ inputs.tag }}" ]; then
            tag="${{ inputs.tag }}"
          else
            tag="v${version}-build${GITHUB_RUN_NUMBER}"
          fi
          echo "version=${version}" >> "$GITHUB_OUTPUT"
          echo "tag=${tag}" >> "$GITHUB_OUTPUT"

  android:
    needs: prepare
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter build apk --release --target-platform android-arm64 --no-pub
      - name: Package
        shell: bash
        run: |
          name="dart_control_panel-${{ needs.prepare.outputs.version }}-android-arm64"
          cp build/app/outputs/flutter-apk/app-release.apk "${name}.apk"
          sha256sum "${name}.apk" > "${name}.apk.sha256"
      - uses: actions/upload-artifact@v4
        with:
          name: android-arm64
          path: |
            dart_control_panel-*-android-arm64.apk
            dart_control_panel-*-android-arm64.apk.sha256

  windows:
    needs: prepare
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter config --enable-windows-desktop
      - run: flutter pub get
      - run: flutter build windows --release
      - name: Package
        shell: pwsh
        run: |
          $name = "dart_control_panel-${{ needs.prepare.outputs.version }}-windows-x64"
          New-Item -ItemType Directory -Path $name | Out-Null
          Copy-Item "build/windows/x64/runner/Release/*" -Destination $name -Recurse -Force
          Compress-Archive -Path $name -DestinationPath "$name.zip" -Force
          $hash = (Get-FileHash "$name.zip" -Algorithm SHA256).Hash
          "$hash  $name.zip" | Out-File -Encoding ascii "$name.zip.sha256"
      - uses: actions/upload-artifact@v4
        with:
          name: windows-x64
          path: |
            dart_control_panel-*-windows-x64.zip
            dart_control_panel-*-windows-x64.zip.sha256

  linux:
    needs: prepare
    runs-on: ubuntu-22.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Install native dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            clang cmake ninja-build pkg-config libgtk-3-dev liblzma-dev \
            libmpv-dev libepoxy-dev patchelf pax-utils
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter build linux --release
      - name: Package
        run: ./tool/package_linux_ci.sh "${{ needs.prepare.outputs.version }}"
      - uses: actions/upload-artifact@v4
        with:
          name: linux-x64
          path: |
            dist/dart_control_panel-*-linux-x64.tar.gz
            dist/dart_control_panel-*-linux-x64.tar.gz.sha256

  release:
    needs: [prepare, android, windows, linux]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.prepare.outputs.tag }}
          name: ${{ needs.prepare.outputs.tag }}
          files: artifacts/*
          generate_release_notes: true
          prerelease: ${{ github.ref_type != 'tag' }}
